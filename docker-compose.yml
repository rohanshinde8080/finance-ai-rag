version: '3.8'

services:
  # ==========================================
  # Database: PostgreSQL 16 with pgvector extension
  # ==========================================
  db:
    image: pgvector/pgvector:pg16
    container_name: financeai_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-finance_ai_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-finance_ai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Backend: FastAPI + SentenceTransformers + FAISS
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financeai_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "FinanceAI"
      APP_ENV: "production"
      DEBUG: "false"
      PORT: 8000
      HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-finance_ai_db}"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-production_secret_key_change_me_super_secret_finance_ai_2026}
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@financeai.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-AdminSecure#2026!}
      INITIAL_ADMIN_NAME: "System Administrator"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      CORS_ORIGINS: '["http://localhost", "http://localhost:80", "http://localhost:3000", "http://localhost:5173"]'
    volumes:
      - faiss_indices:/app/storage/vector_indices
    ports:
      - "8000:8000"

  # ==========================================
  # Frontend & Reverse Proxy: React + Nginx
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: financeai_frontend
    restart: always
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "3000:80"

volumes:
  postgres_data:
    driver: local
  faiss_indices:
    driver: local

